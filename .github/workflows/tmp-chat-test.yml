name: Temporary chat test
on:
  push:
    branches: [claude/tmp-chat-test]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Live brief test
        run: |
          sleep 70
          echo "page: $(curl -s -o /dev/null -w '%{http_code}' https://sirraddo-website.vercel.app/brief)"
          echo "api: $(curl -s 'https://sirraddo-website.vercel.app/api/brief?t=abcdefghijklmnopqrstuvwxyz123456')"
          echo "upload without token store: $(curl -s -X POST 'https://sirraddo-website.vercel.app/api/brief-upload?t=x' --data-binary 'x')"
          echo "robots: $(curl -s https://sirraddo-website.vercel.app/robots.txt | tr '\n' ' ')"

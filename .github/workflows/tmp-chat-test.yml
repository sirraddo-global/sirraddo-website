name: Temporary chat test
on:
  push:
    branches: [claude/tmp-chat-test]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Live lead form test
        run: |
          sleep 60
          curl -s https://sirraddo-website.vercel.app/websites | grep -c 'data-lead=' || true
          curl -s https://sirraddo-website.vercel.app/websites | grep -o '/assets/lead.js?v=[0-9a-f]*' || true
          curl -s -X POST https://sirraddo-website.vercel.app/api/lead -H 'content-type: application/json' \
            -d '{"source":"form","name":"TEST lead form (automated)","contact":"test@example.com","interest":"Starter website","page":"/websites"}'

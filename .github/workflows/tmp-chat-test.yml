name: Temporary chat test
on:
  push:
    branches: [claude/tmp-chat-test]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Live receipt test
        run: |
          sleep 70
          echo "doc: $(curl -s -o /dev/null -w '%{http_code}' 'https://sirraddo-website.vercel.app/doc?t=abcdefghijklmnopqrstuvwxyz123&type=receipt')"
          echo "lead: $(curl -s -X POST https://sirraddo-website.vercel.app/api/lead -H 'content-type: application/json' -d '{"source":"form","name":"TEST email field (automated)","contact":"08000000000","email":"test@example.com","interest":"Starter website"}')"
          echo "email-field: $(curl -s https://sirraddo-website.vercel.app/assets/lead.js | grep -c lead-email)"

<!doctype html>
<html lang="en-NG">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin – SIRRADDO GLOBAL LIMITED</title>
  <meta name="theme-color" content="#13254F">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="stylesheet" href="/assets/admin.css">
  <script src="/assets/admin.js" defer></script>
</head>
<body class="admin">
  <header class="admin-bar">
    <div class="container admin-bar-inner">
      <strong>SIRRADDO · Admin</strong>
      <button class="admin-link" id="logout" type="button" hidden>Log out</button>
    </div>
  </header>

  <main class="container admin-main">
    <form id="login" class="admin-login">
      <h1>Log in</h1>
      <label for="password">Admin password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="btn btn--navy" type="submit">Log in</button>
      <p id="login-error" class="admin-error" role="alert"></p>
    </form>

    <div id="app" hidden>
      <nav class="admin-tabs" aria-label="Admin sections">
        <button type="button" data-tab="dashboard" aria-pressed="true">Dashboard</button>
        <button type="button" data-tab="requests" aria-pressed="false">Requests</button>
        <button type="button" data-tab="clients" aria-pressed="false">Clients</button>
        <button type="button" data-tab="questions" aria-pressed="false">Questions</button>
        <button type="button" data-tab="chats" aria-pressed="false">Chats</button>
        <button type="button" data-tab="assistant" aria-pressed="false">Assistant</button>
        <button type="button" data-tab="settings" aria-pressed="false">Settings</button>
      </nav>
      <p id="app-error" class="admin-error" role="alert"></p>
      <p id="app-status" class="admin-status" role="status" aria-live="polite"></p>
      <section id="view"></section>
    </div>
  </main>

  <!-- Filled in when you print an invoice or receipt (Save as PDF from the print screen). -->
  <div id="print-area" aria-hidden="true"></div>
</body>
</html>

<!doctype html>
<html lang="en-NG">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Rate SIRRADDO · SIRRADDO GLOBAL LIMITED</title>
  <meta name="theme-color" content="#13254F">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/rate.css">
  <script src="/assets/rate.js" defer></script>
</head>
<body>
  <main class="rt-card">
    <div class="rt-logo" aria-label="SIRRADDO GLOBAL LIMITED"><span>SI</span><b>RR</b><span>A</span><b>DD</b><span>O</span><small>GLOBAL LIMITED</small></div>
    <h1 id="rt-title">How did we do?</h1>
    <p id="rt-lead">Loading…</p>

    <form id="rt-form" hidden novalidate>
      <fieldset class="rt-stars">
        <legend>Your rating</legend>
        <input type="radio" name="stars" id="s5" value="5"><label for="s5" title="5 stars">★</label>
        <input type="radio" name="stars" id="s4" value="4"><label for="s4" title="4 stars">★</label>
        <input type="radio" name="stars" id="s3" value="3"><label for="s3" title="3 stars">★</label>
        <input type="radio" name="stars" id="s2" value="2"><label for="s2" title="2 stars">★</label>
        <input type="radio" name="stars" id="s1" value="1"><label for="s1" title="1 star">★</label>
      </fieldset>

      <label class="rt-field">Your review
        <textarea id="rt-text" maxlength="600" rows="5" placeholder="What was it like working with us? How has the website helped your business?"></textarea>
      </label>
      <div class="rt-row">
        <label class="rt-field">Your name
          <input id="rt-name" maxlength="50" autocomplete="name">
        </label>
        <label class="rt-field">Business name
          <input id="rt-business" maxlength="80" autocomplete="organization">
        </label>
      </div>

      <div class="rt-photo">
        <img id="rt-preview" alt="" hidden>
        <label class="rt-btn rt-btn--light" for="rt-file">Add your photo or logo (optional)</label>
        <input type="file" id="rt-file" accept="image/*" hidden>
      </div>

      <label class="rt-consent"><input type="checkbox" id="rt-consent"> SIRRADDO may show this review, with my name, business and photo, on its website and in its marketing.</label>

      <p id="rt-msg" class="rt-msg" role="alert"></p>
      <button class="rt-btn" type="submit">Send my review</button>
    </form>

    <p class="rt-small">Reviews show once we have checked them. Questions? <a href="https://wa.me/2348167550937">WhatsApp us</a>.</p>
  </main>
</body>
</html>
